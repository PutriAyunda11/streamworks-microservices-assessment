version: '3.8'

services:
  # 1. Container Database PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: streamworks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ayunda1923
    ports:
      - "5432:5432"
    networks:
      - streamworks-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Container Cache Redis
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - streamworks-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API Service 1 (JSON + Redis)
  api-service-1:
    build:
      context: ./api-service-1
      dockerfile: DockerFile
    container_name: api-service-1
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOST=redis-cache
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - streamworks-net

  # 4. API Service 2 (XML + PostgreSQL)
  api-service-2:
    build:
      context: ./api-service-2
      dockerfile: DockerFile
    container_name: api-service-2
    ports:
      - "8082:8082"
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ayunda1923
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - streamworks-net

  # 5. API Gateway (Spring Cloud Gateway)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: DockerFile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - api-service-1
      - api-service-2
    networks:
      - streamworks-net

networks:
  streamworks-net:
    driver: bridge